[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "netprobe-kit"
version = "0.1.0"
description = "Offline-reproducible DNS tampering (bogon/sinkhole/NXDOMAIN), HTTP blockpage & captive-portal injection, and TLS SNI/middlebox forensic evidence analyzer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "censorship",
    "digital-rights",
    "dns-tampering",
    "tls",
    "network-diagnostics",
    "internet-freedom",
    "middlebox",
    "forensics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
netprobe-kit = "netprobe_kit.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/netprobe-kit"
Repository = "https://github.com/codesphere-u/netprobe-kit"
Issues = "https://github.com/codesphere-u/netprobe-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/netprobe_kit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["netprobe_kit"]
